
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music — Ryan Pollie</title>

<style>
* {
  box-sizing: border-box;
}

html {
  background: white;
  color: black;
  font-family: Helvetica, Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
}

a {
  color: inherit;
}

a:hover {
  color: pink;
}

.page-header {
  position: relative;
  padding: 24px 24px 0;
  text-align: center;
}

.home {
  position: absolute;
  left: 24px;
  top: 29px;
  font-size: 15px;
  text-decoration: underline;
}

h1 {
  font-size: clamp(40px, 6vw, 76px);
  font-weight: 400;
  line-height: 1;
  margin: 0 0 64px;
}

main {
  width: min(1100px, calc(100% - 120px));
  margin: 0 auto 100px;
}

.section {
  margin-bottom: 78px;
}

.section h3 {
  font-size: 25px;
  font-weight: 400;
  text-align: left;
  margin: 0 0 34px;
}

.works {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 42px 28px;
}

.work {
  display: block;
  min-width: 0;
  color: black;
  text-decoration: none;
}

a.work {
  cursor: pointer;
}

a.work:hover {
  color: pink;
}

.cover {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: white;
  overflow: hidden;
}

.cover img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.work-title {
  margin-top: 11px;
  font-weight: 700;
  font-style: italic;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.work-year {
  margin-top: 3px;
  font-weight: 400;
  font-style: normal;
  line-height: 1.35;
}

@media (max-width: 650px) {
  .page-header {
    padding: 22px 12px 0;
  }

  .home {
    left: 12px;
    top: 24px;
    font-size: 13px;
  }

  h1 {
    font-size: 46px;
    margin-bottom: 58px;
  }

  main {
    width: calc(100% - 32px);
    margin-bottom: 70px;
  }

  .section {
    margin-bottom: 56px;
  }

  .section h3 {
    font-size: 23px;
    margin-bottom: 24px;
  }

  .works {
    grid-template-columns: minmax(0, 1fr);
    gap: 34px;
  }
}
</style>
</head>

<body>

<header class="page-header">
  <a class="home" href="./index.html">home</a>
  <h1>Music</h1>
</header>

<main id="content"></main>

<script>
(() => {
  'use strict';

  const API =
    'https://tds-web-editor-public.trey-d-shilts.workers.dev/api/public/ryan/music';

  const root = document.getElementById('content');

  function el(tag, value, className) {
    const node = document.createElement(tag);

    if (value !== undefined) {
      node.textContent = value;
    }

    if (className) {
      node.className = className;
    }

    return node;
  }

  function validLink(value) {
    if (!value) return null;

    try {
      const url = new URL(value);

      return ['https:', 'http:'].includes(url.protocol)
        ? url.href
        : null;
    } catch {
      return null;
    }
  }

  function render(sections) {
    root.replaceChildren();

    for (const section of sections) {
      const box = el(
        'section', undefined, 'section'
      );

      if (section.title) {
        box.append(
          el('h3', section.title)
        );
      }

      const grid = el(
        'div', undefined, 'works'
      );

      for (const work of (section.works || [])) {
        const link = validLink(work.link);

        const item = el(
          link ? 'a' : 'div',
          undefined,
          'work'
        );

        if (link) {
          item.href = link;
          item.target = '_blank';
          item.rel = 'noopener noreferrer';
        }

        const cover = el(
          'div', undefined, 'cover'
        );

        if (work.image) {
          const image = document.createElement('img');

          image.src = work.image;
          image.alt = work.title || 'Album cover';
          image.loading = 'lazy';

          cover.append(image);
        }

        item.append(cover);

        if (work.title) {
          item.append(
            el('div', work.title, 'work-title')
          );
        }

        if (work.year) {
          item.append(
            el('div', work.year, 'work-year')
          );
        }

        grid.append(item);
      }

      box.append(grid);
      root.append(box);
    }
  }

  async function load() {
    try {
      const response = await fetch(API, {
        cache: 'no-store'
      });

      if (!response.ok) {
        throw new Error('Unable to load music');
      }

      const data = await response.json();

      render(
        Array.isArray(data.sections)
          ? data.sections
          : []
      );

    } catch (error) {
      console.error(error);

      root.append(
        el(
          'p',
          'Music is temporarily unavailable.'
        )
      );
    }
  }

  load();
})();
</script>

</body>
</html>
