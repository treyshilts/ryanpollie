
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryan Pollie</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: white;
      color: black;
      font-family: Helvetica, Arial, sans-serif;
      font-weight: 400;
    }

    .homepage {
      height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px;
      overflow: hidden;
    }

    h1 {
      font-size: clamp(42px, 6vw, 85px);
      font-weight: 400;
      line-height: 1;
      margin: 0 0 24px;
      text-align: center;
      flex-shrink: 0;
    }

    h1:hover {
      color: pink;
    }

    .main-image {
      display: block;
      max-width: 100%;
      max-height: 55%;
      min-height: 0;
      width: auto;
      height: auto;
      object-fit: contain;
      flex-shrink: 1;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      width: max-content;
      max-width: none;
      margin-top: 24px;
      font-size: clamp(16px, 2.5vw, 24px);
      font-weight: 400;
      line-height: 1.2;
      white-space: nowrap;
      flex-shrink: 0;
      transform-origin: center top;
    }

    nav a {
      color: black;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      font-weight: 400;
    }

    nav a:hover {
      color: pink;
    }

    nav .separator {
      margin: 0 0.25em;
      color: black;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .homepage {
        padding: 20px 12px;
      }

      h1 {
        font-size: clamp(32px, 10vw, 48px);
        margin-bottom: 20px;
      }

      .main-image {
        max-height: 50%;
      }

      nav {
        font-size: 24px;
        margin-top: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="homepage">

    <h1>RYAN POLLIE</h1>

    <img
      class="main-image"
      src="ryan-pic.jpeg"
      alt="Ryan Pollie"
    >

    
    <nav aria-label="Main navigation" id="main-nav">
      <a>music</a>
      <span class="separator">⋆</span>
      <a>production</a>
      <span class="separator">⋆</span>
      <a href="art.html">art</a>
      <span class="separator">⋆</span>
      <a>RP presents</a>
      <span class="separator">⋆</span>
      <a>mailing list</a>
      <span class="separator">⋆</span>
      <a>press</a>
    </nav>

  </main>

  <script>
    function resizeNav() {
      const nav = document.getElementById('main-nav');

      nav.style.transform = 'none';

      const isMobile = window.innerWidth <= 600;
      const margin = isMobile ? 24 : 40;
      const availableWidth = window.innerWidth - margin;
      const actualWidth = nav.scrollWidth;

      const scale = Math.min(1, availableWidth / actualWidth);

      nav.style.transform = `scale(${scale})`;
    }

    window.addEventListener('load', resizeNav);
    window.addEventListener('resize', resizeNav);

    if (document.fonts) {
      document.fonts.ready.then(resizeNav);
    }
  </script>
</body>
</html>
