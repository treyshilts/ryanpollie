<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryan Pollie</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: white;
      color: black;
      font-family: Helvetica, Arial, sans-serif;
    }

    .homepage {
      height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px;
      overflow: hidden;
    }

    h1 {
      font-size: clamp(42px, 6vw, 85px);
      font-weight: normal;
      line-height: 1;
      margin: 0 0 24px;
      text-align: center;
      flex-shrink: 0;
    }

    h1:hover {
      color: pink;
    }

    .main-image {
      display: block;
      max-width: 100%;
      max-height: 55%;
      min-height: 0;
      width: auto;
      height: auto;
      object-fit: contain;
      flex-shrink: 1;
    }

    nav {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 100%;
      margin-top: 24px;
      text-align: center;
      font-size: clamp(12px, 2.5vw, 40px);
      line-height: 1.2;
      white-space: nowrap;
      flex-shrink: 0;
    }

    nav a {
      color: black;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }

    nav a:hover {
      color: pink;
    }

    nav a:not(:last-child)::after {
      content: " / ";
      color: black;
      white-space: pre;
    }

    @media (max-width: 600px) {
      .homepage {
        padding: 20px 8px;
      }

      h1 {
        font-size: clamp(32px, 10vw, 48px);
        margin-bottom: 20px;
      }

      .main-image {
        max-height: 50%;
      }

      nav {
        font-size: clamp(9px, 2.45vw, 15px);
        margin-top: 20px;
        letter-spacing: -0.2px;
      }
    }

    @media (max-width: 380px) {
      nav {
        font-size: 2.3vw;
        letter-spacing: -0.3px;
      }
    }
  </style>
</head>

<body>
  <main class="homepage">

    <h1>RYAN POLLIE</h1>

    <img
      class="main-image"
      src="ryan-pic.jpeg"
      alt="Ryan Pollie"
    >

    <nav aria-label="Main navigation">
      <a>music</a>
      <a>production</a>
      <a>art</a>
      <a>RP presents</a>
      <a>mailing list</a>
      <a>press</a>
    </nav>

  </main>
</body>
</html>
